<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un Rincón Para Ti ❤️</title>
  <style>
    :root {
      --bg-color: #fff5f7;
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary: #ff4d6d;
      --primary-dark: #c9184a;
      --accent: #ffb3c1;
      --text: #2b2d42;
      --text-light: #6c757d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo con animación de corazones flotantes */
    .bg-hearts {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .heart-particle {
      position: absolute;
      bottom: -30px;
      opacity: 0.6;
      animation: floatUp 8s infinite linear;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
      100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
    }

    /* Encabezado */
    header {
      text-align: center;
      padding: 25px 10px 15px;
      position: relative;
      z-index: 1;
      animation: fadeInDown 0.8s ease;
    }

    header h1 {
      color: var(--primary-dark);
      font-size: 2.3rem;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-light);
      font-size: 1.05rem;
    }

    /* Navegación tipo Carpetas / pestañas */
    .folders-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0 30px;
      position: relative;
      z-index: 1;
      animation: fadeIn 1s ease;
    }

    .folder-btn {
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid transparent;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .folder-btn:hover {
      transform: translateY(-2px);
      background: #ffffff;
      box-shadow: 0 6px 15px rgba(255, 77, 109, 0.15);
    }

    .folder-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 6px 18px rgba(255, 77, 109, 0.35);
      transform: scale(1.05);
    }

    /* Catálogo de Tarjetas */
    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      border: 1px solid rgba(255, 255, 255, 0.8);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.5s forwards ease-out;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 25px rgba(255, 77, 109, 0.2);
    }

    /* Animación de resplandor cuando un audio se reproduce */
    .card.is-playing {
      border: 2px solid var(--primary);
      box-shadow: 0 0 20px rgba(255, 77, 109, 0.35);
      animation: pulsePlaying 2s infinite alternate;
    }

    @keyframes pulsePlaying {
      0% { box-shadow: 0 0 10px rgba(255, 77, 109, 0.2); }
      100% { box-shadow: 0 0 25px rgba(255, 77, 109, 0.5); }
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }

    .card-icon {
      font-size: 2.2rem;
      background: #ffe5ec;
      padding: 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .card:hover .card-icon {
      transform: rotate(8deg) scale(1.1);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }

    .card-category-tag {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary-dark);
      background: #ffe5ec;
      padding: 2px 8px;
      border-radius: 10px;
      display: inline-block;
      margin-top: 4px;
    }

    .card-desc {
      font-size: 0.95rem;
      color: var(--text-light);
      margin: 12px 0 16px;
      line-height: 1.45;
    }

    .audio-player {
      width: 100%;
      margin-top: 8px;
      border-radius: 30px;
      outline: none;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed rgba(0,0,0,0.08);
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .badge {
      background-color: #fff0f3;
      color: var(--primary-dark);
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 700;
      transition: transform 0.3s ease;
    }

    /* Animaciones Generales */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .empty-msg {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: var(--text-light);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Fondo animado de corazones -->
  <div class="bg-hearts" id="heartsContainer"></div>

  <header>
    <h1>✨ Tu Rincón Especial</h1>
    <p>Historias, cuentos y palabras siempre para ti.</p>
  </header>

  <!-- Navegación por carpetas/secciones -->
  <nav class="folders-nav">
    <button class="folder-btn active" onclick="filterCategory('todos', event)">
      <span>✨</span> Todos
    </button>
    <button class="folder-btn" onclick="filterCategory('cuentos', event)">
      <span>📖</span> Cuentos
    </button>
    <button class="folder-btn" onclick="filterCategory('historias', event)">
      <span>👩‍❤️‍👨</span> Historias Nuestras
    </button>
    <button class="folder-btn" onclick="filterCategory('animo', event)">
      <span>💖</span> Para cuando estés triste
    </button>
  </nav>

  <!-- Lista de audios -->
  <main class="catalog" id="catalogContainer"></main>

  <script>
    let allAudios = [];
    let currentCategory = 'todos';

    // Generar partículas de corazones flotantes
    function createFloatingHearts() {
      const container = document.getElementById('heartsContainer');
      const icons = ['❤️', '💖', '✨', '🌸', '💕'];
      for (let i = 0; i < 16; i++) {
        const heart = document.createElement('span');
        heart.className = 'heart-particle';
        heart.innerText = icons[Math.floor(Math.random() * icons.length)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${6 + Math.random() * 6}s`;
        heart.style.animationDelay = `${Math.random() * 5}s`;
        heart.style.fontSize = `${1 + Math.random() * 0.8}rem`;
        container.appendChild(heart);
      }
    }

    // Registro de cuantas veces se ha escuchado cada audio
    const getPlaysCount = () => JSON.parse(localStorage.getItem('cuentos_plays') || '{}');
    const savePlayCount = (id) => {
      const plays = getPlaysCount();
      plays[id] = (plays[id] || 0) + 1;
      localStorage.setItem('cuentos_plays', JSON.stringify(plays));
      const countSpan = document.getElementById(`count-${id}`);
      if (countSpan) {
        countSpan.innerText = `${plays[id]} veces escuchado`;
        countSpan.style.transform = 'scale(1.15)';
        setTimeout(() => countSpan.style.transform = 'scale(1)', 300);
      }
    };

    // Renderizar catálogo según la carpeta seleccionada
    function renderCatalog() {
      const catalogContainer = document.getElementById('catalogContainer');
      const plays = getPlaysCount();
      catalogContainer.innerHTML = '';

      const filtered = currentCategory === 'todos' 
        ? allAudios 
        : allAudios.filter(item => item.categoria === currentCategory);

      if (filtered.length === 0) {
        catalogContainer.innerHTML = `<div class="empty-msg">Aún no hay audios en esta carpeta 💖</div>`;
        return;
      }

      filtered.forEach((item, index) => {
        const count = plays[item.id] || 0;
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${index * 0.08}s`;

        const categoryNames = {
          'cuentos': '📖 Cuento',
          'historias': '👩‍❤️‍👨 Historia Nuestra',
          'animo': '💖 Un abrazo para ti'
        };

        card.innerHTML = `
          <div>
            <div class="card-header">
              <div class="card-icon">${item.icono || '🎧'}</div>
              <div>
                <div class="card-title">${item.titulo}</div>
                <span class="card-category-tag">${categoryNames[item.categoria] || '🎧 Audio'}</span>
              </div>
            </div>
            <p class="card-desc">${item.descripcion}</p>
          </div>
          <div>
            <audio class="audio-player" controls preload="metadata" id="audio-${item.id}">
              <source src="${item.audioUrl}" type="audio/mpeg">
              Tu navegador no soporta reproducción de audio.
            </audio>
            <div class="stats">
              <span class="badge" id="count-${item.id}">${count} veces escuchado</span>
              <span>🎙️ Narrado por mí</span>
            </div>
          </div>
        `;

        catalogContainer.appendChild(card);

        const audioElement = document.getElementById(`audio-${item.id}`);
        let counted = false;

        // Auto-pausar otros audios si reproduce uno nuevo
        audioElement.addEventListener('play', () => {
          document.querySelectorAll('audio').forEach(other => {
            if (other !== audioElement) other.pause();
          });
          card.classList.add('is-playing');
        });

        audioElement.addEventListener('pause', () => {
          card.classList.remove('is-playing');
        });

        // Contar reproducción tras 5 segundos de audio
        audioElement.addEventListener('timeupdate', () => {
          if (audioElement.currentTime > 5 && !counted) {
            counted = true;
            savePlayCount(item.id);
          }
        });

        audioElement.addEventListener('ended', () => {
          counted = false;
          card.classList.remove('is-playing');
        });
      });
    }

    // Cambiar de categoría
    function filterCategory(cat, evt) {
      currentCategory = cat;
      document.querySelectorAll('.folder-btn').forEach(btn => btn.classList.remove('active'));
      evt.currentTarget.classList.add('active');
      renderCatalog();
    }

    // Cargar datos desde cuentos.json
    async function loadCatalog() {
      try {
        const response = await fetch('cuentos.json');
        allAudios = await response.json();
        renderCatalog();
      } catch (error) {
        console.error("Error al cargar cuentos.json:", error);
      }
    }

    createFloatingHearts();
    loadCatalog();
  </script>
</body>
</html>
